name: CI

# 触发：所有 push 到 main / codex/** 分支与针对 main 的 PR
# 策略：失败即红，禁用无关的 workflow_run 触发以节省 CI 配额
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main, 'codex/**']

# 减少冗余：同一 PR 后续 push 自动取消上一次未完成的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Python：pytest + pip-audit（覆盖后端全部安全加固）
  # ============================================================
  python:
    name: Python (pytest + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 升级 pip
        run: python -m pip install --upgrade pip

      - name: 安装运行时 + 测试 + 审计依赖
        # 故意不装 ML 栈（yt-dlp / torch 等约 2GB+，CI 不需要：
        # pytest 用 MockTransport 不发真实请求；pip-audit 单独审计 manifest）
        run: |
          pip install "fastapi>=0.110" "uvicorn[standard]>=0.27" "httpx>=0.27"
          pip install pytest pytest-asyncio pip-audit

      - name: 后端测试（pytest）
        # --basetemp 显式可写目录，绕过 GitHub Actions sandbox 的只读限制
        run: pytest --basetemp=/tmp/dcs-pytest-tmp -v

      - name: 依赖漏洞审计：已安装运行时
        # 实际使用的依赖面，发现即红
        run: pip-audit

      - name: 依赖漏洞审计：server/requirements.txt 顶层包
        # server/requirements.txt 使用 >= 宽松约束，pip-audit -r 需要 pin。
        # 将每个包解析到当前最新版本，生成临时 pin 文件再审计。
        run: |
          set -e
          : > /tmp/dcs-pinned.txt
          for pkg in yt-dlp faster-whisper onnxruntime openai-whisper ctranslate2 torch openai; do
            latest=$(pip index versions "$pkg" 2>/dev/null | head -1 | sed -E 's/.*\(([^)]*)\).*/\1/' | awk '{print $1}')
            if [ -z "$latest" ]; then
              echo "::warning::无法解析 $pkg 的最新版本，跳过"
              continue
            fi
            echo "${pkg}==${latest}" >> /tmp/dcs-pinned.txt
          done
          echo "pinned manifest:"
          cat /tmp/dcs-pinned.txt
          pip-audit -r /tmp/dcs-pinned.txt --no-deps --disable-pip

  # ============================================================
  # Node：引擎自测 + 压测 + 单文件一致性
  # ============================================================
  node:
    name: Node (engine + stress + single-file consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # 前端零 npm 依赖、无 lockfile，不能设 cache: npm
          # （setup-node 找不到 package-lock.json 会直接报错退出）
          cache: ""

      - name: 引擎自测
        run: node test-engine.js

      - name: 全量功能压测
        run: node stress-test.js

      - name: 单文件构建一致性（standalone.html 与模块源一致）
        # 修改 js/ / css/ 后必须重新打包 standalone.html；该检查保证文档不漂移
        run: node build-single.js --check